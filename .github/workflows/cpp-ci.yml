name: C++ Native Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Project
        run: cmake --build build --config Release
      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure
      - name: Verify CLI
        run: |
          ./build/bin/Sysspec --help
          ./build/bin/Sysspec --plain
          ./build/bin/Sysspec --json