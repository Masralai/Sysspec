name: Docker Build Check

on:
    push:
        branches: [ "master" ]

jobs:
    docker-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./Dockerfile
                push: false
                load: true
                tags: sysspec:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max
            - name: Run container smoke test
              run: |
                docker run --rm -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /etc/os-release:/host/etc/os-release:ro -e SYSSPEC_HOST_ROOT=/host sysspec:latest --plain
                docker run --rm -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /etc/os-release:/host/etc/os-release:ro -e SYSSPEC_HOST_ROOT=/host sysspec:latest --json